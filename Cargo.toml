[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
hiroi-daemon = { path = "crates/hiroi-daemon" }
hiroi-engine = { path = "crates/hiroi-engine" }
hiroi-grab = { path = "crates/hiroi-grab" }
hiroi-proto = { path = "crates/hiroi-proto" }
hiroi-store = { path = "crates/hiroi-store" }
hiroi-testserver = { path = "crates/hiroi-testserver" }

aes = "0.9"
anyhow = "1"
axum = "0.8"
bytes = "1"
cbc = "0.2"
clap = { version = "4.6", features = ["derive", "env"] }
dialoguer = { version = "0.12", default-features = false }
directories = "6"
fastrand = "2"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
httpdate = "1"
indicatif = "0.18"
jiff = "1"
# Only with the `torrent` feature.
librqbit = { version = "9", default-features = false, features = ["rust-tls"] }
lol_html = "3"
md-5 = "0.11"
parking_lot = "0.12"
percent-encoding = "2"
quick-xml = "0.42"
# HTTP/2 is left out on purpose: it multiplexes every range request over one
# TCP connection, which defeats the point of parallel connections.
reqwest = { version = "0.13", default-features = false, features = ["cookies", "rustls", "stream", "socks"] }
# Bundled: no system SQLite needed, same version everywhere.
rusqlite = { version = "0.43", features = ["bundled"] }
# Only with the `sftp` feature.
russh = { version = "0.65", default-features = false, features = ["aws-lc-rs"] }
russh-sftp = "3"
rustix = { version = "1", features = ["fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
shell-words = "1"
# Only with the `ftp` feature.
suppaftp = { version = "13", default-features = false, features = ["tokio", "tokio-rustls-aws-lc-rs"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
tokio-socks = "0.5"
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
