[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
hiroi-engine = { path = "crates/hiroi-engine" }
hiroi-proto = { path = "crates/hiroi-proto" }
hiroi-daemon = { path = "crates/hiroi-daemon" }
hiroi-store = { path = "crates/hiroi-store" }
hiroi-testserver = { path = "crates/hiroi-testserver" }

anyhow = "1"
axum = "0.8"
directories = "6"
clap = { version = "4.6", features = ["derive"] }
fastrand = "2"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
httpdate = "1"
indicatif = "0.18"
md-5 = "0.11"
parking_lot = "0.12"
percent-encoding = "2"
# HTTP/2 is left out on purpose: it multiplexes every range request over one
# TCP connection, which defeats the point of parallel connections.
# Bundled: no system SQLite needed, same version everywhere.
rusqlite = { version = "0.43", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "socks"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
