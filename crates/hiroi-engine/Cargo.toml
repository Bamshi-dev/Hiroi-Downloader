[package]
name = "hiroi-engine"
description = "Download engine of Hiroi Downloader: segmented, resumable, polite multi-connection HTTP downloads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aes.workspace = true
bytes.workspace = true
cbc.workspace = true
fastrand.workspace = true
futures-util.workspace = true
hex.workspace = true
httpdate.workspace = true
librqbit = { workspace = true, optional = true }
md-5.workspace = true
parking_lot.workspace = true
percent-encoding.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
suppaftp = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { workspace = true, optional = true }
tokio-socks = { workspace = true, optional = true }
tokio-util.workspace = true
tracing.workspace = true

[features]
# Entry points for the fuzz targets in fuzz/; not a public API.
fuzzing = []
# FTP and FTPS sources, off by default.
ftp = ["dep:suppaftp", "dep:tokio-rustls", "dep:tokio-socks"]
# SFTP sources, checked against known_hosts. Off by default.
sftp = ["dep:russh", "dep:russh-sftp", "dep:tokio-socks"]
# BitTorrent and magnet links. Peers see the address you download from.
torrent = ["dep:librqbit"]

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
hiroi-testserver.workspace = true
tempfile.workspace = true

[lints]
workspace = true
