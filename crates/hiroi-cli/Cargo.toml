[package]
name = "hiroi-cli"
description = "Command-line front end of Hiroi Downloader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hiroi"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
dialoguer.workspace = true
hiroi-daemon.workspace = true
hiroi-engine.workspace = true
hiroi-grab.workspace = true
hiroi-proto.workspace = true
indicatif.workspace = true
serde_json.workspace = true
shell-words.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true

[features]
# Optional protocols, off by default to keep the build small.
ftp = ["hiroi-engine/ftp"]

[lints]
workspace = true
